<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16262b" />
    <link rel="icon" href="data:," />
    <!-- the UI face (self-hosted subset, see src/modules/ui/fonts): fetched before the stylesheet asks, so the boot title never flashes in a fallback -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/modules/ui/fonts/noto-serif-tc-ui-500.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/modules/ui/fonts/noto-serif-tc-ui-400.woff2" />
    <title>青島八大關 · 漫步</title>
    <meta name="description" content="紅瓦綠樹，碧海藍天——在瀏覽器裡漫步青島八大關。" />
    <style>
      :root { color-scheme: dark; --ink: #f3efe4; --sea: #16262b; --serif: "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", "STSong", "SimSun", serif; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sea); color: var(--ink); font-family: var(--serif); }
      #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #ui-root > * { pointer-events: auto; }
      #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(120% 90% at 50% 40%, #223a40 0%, #16262b 60%, #0e191c 100%); transition: opacity 0.9s ease, visibility 0.9s; }
      #boot.done { opacity: 0; visibility: hidden; pointer-events: none; }
      #boot .card { text-align: center; }
      #boot h1 { font-weight: 500; font-size: clamp(40px, 9vw, 84px); letter-spacing: 0.32em; margin: 0 0 0 0.32em; }
      #boot p { margin: 14px 0 34px; letter-spacing: 0.5em; font-size: 14px; opacity: 0.72; }
      #boot .bar { width: min(280px, 60vw); height: 1px; margin: 0 auto; background: rgba(243, 239, 228, 0.18); }
      #boot .bar i { display: block; height: 100%; width: 0; background: #d98a4e; transition: width 0.25s ease; }
      #boot .label { margin-top: 12px; font-size: 12px; letter-spacing: 0.3em; opacity: 0.5; min-height: 1.4em; }
      #boot.failed .label { color: #ffb4a0; opacity: 1; letter-spacing: 0.05em; }
    </style>
  </head>
  <body>
    <canvas id="scene" tabindex="0" aria-label="青島八大關三維場景"></canvas>
    <div id="ui-root"></div>
    <div id="boot" role="status" aria-live="polite">
      <div class="card">
        <h1>八大關</h1>
        <p>紅瓦綠樹 · 碧海藍天</p>
        <div class="bar"><i id="boot-bar"></i></div>
        <div class="label" id="boot-label">載入中</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
